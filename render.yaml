services:
  - type: web
    name: newsbit-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    autoDeploy: false
    workingDirectory: backend
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: G_NEWS_API_URL
        sync: false
      - key: G_NEWS_API_KEY
        sync: false
      - key: NEWS_API_URL
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: SCHEDULER_SECRET
        sync: false
