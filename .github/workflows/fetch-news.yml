name: Fetch News Scheduler

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"  # Every 6 hours at UTC 00:00, 06:00, 12:00, 18:00 (IST 05:30, 11:30, 17:30, 23:30)
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-scheduler.txt

      - name: Check required secrets
        run: |
          echo "Checking GitHub Secrets configuration..."
          missing_secrets=()

          if [ -z "${{ secrets.DATABASE_URL }}" ]; then missing_secrets+=("DATABASE_URL"); fi
          if [ -z "${{ secrets.NEWS_API_URL }}" ]; then missing_secrets+=("NEWS_API_URL"); fi
          if [ -z "${{ secrets.NEWS_API_KEY }}" ]; then missing_secrets+=("NEWS_API_KEY"); fi
          if [ -z "${{ secrets.GROQ_API_KEY01 }}" ]; then missing_secrets+=("GROQ_API_KEY01"); fi
          if [ -z "${{ secrets.GROQ_API_KEY02 }}" ]; then missing_secrets+=("GROQ_API_KEY02"); fi
          if [ -z "${{ secrets.G_NEWS_API_URL }}" ]; then missing_secrets+=("G_NEWS_API_URL"); fi
          if [ -z "${{ secrets.G_NEWS_API_KEY }}" ]; then missing_secrets+=("G_NEWS_API_KEY"); fi
          if [ -z "${{ secrets.FRONTEND_URL }}" ]; then missing_secrets+=("FRONTEND_URL"); fi

          if [ ${#missing_secrets[@]} -gt 0 ]; then
            echo "❌ Error: The following GitHub Secrets are not configured:"
            for secret in "${missing_secrets[@]}"; do
              echo "  - $secret"
            done
            echo ""
            echo "To fix this:"
            echo "1. Go to your GitHub repository"
            echo "2. Navigate to Settings > Secrets and variables > Actions"
            echo "3. Click 'New repository secret' and add each missing secret"
            echo ""
            echo "Required secrets:"
            echo "  - DATABASE_URL (PostgreSQL connection string)"
            echo "  - NEWS_API_URL (News API endpoint)"
            echo "  - NEWS_API_KEY (News API key)"
            echo "  - GROQ_API_KEY01 (Groq API key 1 for LLM)"
            echo "  - GROQ_API_KEY02 (Groq API key 2 for LLM)"
            echo "  - G_NEWS_API_URL (GNews API endpoint)"
            echo "  - G_NEWS_API_KEY (GNews API key)"
            echo "  - FRONTEND_URL (Frontend application URL)"
            echo "  - SCHEDULER_SECRET (Secret for scheduler authentication)"
            exit 1
          fi
          echo "✓ All required secrets are configured"

      - name: Run scheduler job
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEWS_API_URL: ${{ secrets.NEWS_API_URL }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GROQ_API_KEY01: ${{ secrets.GROQ_API_KEY01 }}
          GROQ_API_KEY02: ${{ secrets.GROQ_API_KEY02 }}
          G_NEWS_API_URL: ${{ secrets.G_NEWS_API_URL }}
          G_NEWS_API_KEY: ${{ secrets.G_NEWS_API_KEY }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
        run: |
          python -c "
          import asyncio
          import sys
          sys.path.insert(0, '.')
          from app.scheduler import run_news_fetch_job
          asyncio.run(run_news_fetch_job())
          "
