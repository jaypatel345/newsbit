name: Keep Backend Warm

on:
  schedule:
    - cron: "*/10 * * * *"  # every 10 minutes, well under Render's 15-min free-tier sleep window
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sf -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" \
            https://newsbit-bgbi.onrender.com/health || echo "Ping failed (backend may be cold-starting)"
